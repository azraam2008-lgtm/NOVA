# Nova telefon uygulamasını Expo'ya yükler; iPhone'da Expo Go ile açılır.
# Bilgisayarda hiçbir şey çalıştırmak gerekmez. Uygulama depoda mobil/ klasöründe durur;
# main'de mobil/ değişince kendiliğinden çalışır, "Run workflow" ile elle de çalıştırılabilir.
# Eski düzen: depoya mobil.zip yüklenirse görev onu açıp mobil/ klasörünün yerine koyar.
#
# Gerekli gizli değişken (Settings -> Secrets and variables -> Actions):
#   EXPO_TOKEN                 expo.dev -> Account settings -> Access tokens
# İsteğe bağlı:
#   EXPO_PUBLIC_SUPABASE_KEY   Supabase'in HERKESE AÇIK (publishable) anahtarı.
#                              Yoksa uygulama deneme kipinde açılır (veriler telefonda kalır).
name: Nova telefon uygulamasi

on:
  push:
    branches: [main]
    paths: ["mobil.zip", "mobil/**", ".github/workflows/nova-mobil.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-mobil
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Expo anahtari var mi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN tanimli degil. expo.dev'de bir Access token olustur, GitHub'da Settings > Secrets and variables > Actions altina EXPO_TOKEN adiyla ekle."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Uygulamayi zip'ten cikar
        run: |
          if [ -f mobil.zip ]; then
            rm -rf mobil
            unzip -q -o mobil.zip
          fi
          if [ ! -f mobil/package.json ]; then
            echo "::error::mobil/package.json bulunamadi. Telefon uygulamasi depoda mobil/ klasorunde olmali."
            exit 1
          fi
          echo "Uygulama surumu: $(node -p "require('./mobil/package.json').dependencies.expo")"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobil/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Paketleri kur
        working-directory: mobil
        run: npm ci

      - name: Expo projesine bagla
        working-directory: mobil
        run: eas init --non-interactive --force

      - name: Expo Go icin hazirla
        id: hazir
        working-directory: mobil
        run: node scripts/expo_hazirla.js

      - name: Yayinla
        working-directory: mobil
        env:
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_SAHTE: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY == '' && '1' || '0' }}
          MESAJ: ${{ github.event.head_commit.message || 'Elle yayin' }}
        run: eas update --channel nova --message "$MESAJ" --non-interactive

      - name: Telefonda ac
        env:
          EXP: ${{ steps.hazir.outputs.exp }}
          QR: ${{ steps.hazir.outputs.qr }}
          KIP: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY == '' && 'Deneme kipi (veriler yalnizca telefonda kalir)' || 'Gercek hesaplarla' }}
        run: |
          {
            echo "## Nova telefonda hazir"
            echo ""
            echo "iPhone kamerasini bu koda tut, cikan Expo Go bildirimine dokun:"
            echo ""
            echo "![QR]($QR)"
            echo ""
            echo "Telefondan bu sayfayi aciyorsan dogrudan su baglantiya dokun: $EXP"
            echo ""
            echo "Kip: $KIP"
          } >> "$GITHUB_STEP_SUMMARY"
