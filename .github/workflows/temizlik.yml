# Bir kerelik temizlik: Safari'nin klasör yüklerken deponun ana sayfasına
# dağıttığı 25 eski uygulama dosyasını siler. Yalnızca bu listedeki dosyalara
# dokunur; sitenin hiçbir dosyası listede yok. İşi bitince kendini de siler.
# Çalıştırmak için: Actions -> "Bir kerelik temizlik" -> Run workflow
name: Bir kerelik temizlik

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temizle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yanlis yere giden dosyalari sil
        run: |
          for f in AGENTS.md AnaEkran.tsx App.tsx Asistan.tsx EklePaneli.tsx Giris.tsx Kurulum.tsx \
                   android-icon-background.png android-icon-foreground.png android-icon-monochrome.png \
                   app.json bilesenler.tsx dil.ts favicon.png hesap.ts icon.png index.ts \
                   package-lock.json package.json splash-icon.png tsconfig.json veri.ts \
                   yemekler.json yemekler.ts yemekleri_aktar.py; do
            if [ -f "$f" ]; then git rm -q "$f" && echo "silindi: $f"; fi
          done
          git rm -q .github/workflows/temizlik.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Ana sayfaya dagilan eski uygulama dosyalari temizlendi"
          git push
